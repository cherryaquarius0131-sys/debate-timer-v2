<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCU 辯論計時器</title>
    <style>
        :root {
            --primary: #00E5FF;
            --warning: #FF9900;
            --danger: #FF0033;
            --bg-dark: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: linear-gradient(135deg, var(--bg-dark), #1e293b);
            color: white; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden;
        }
        /* 毛玻璃面板 */
        .timer-card {
            background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border); border-radius: 24px; padding: 40px; width: 90%; max-width: 500px;
            text-align: center; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        h1 { font-size: 1.5rem; margin-bottom: 20px; color: var(--primary); letter-spacing: 2px; }
        
        /* 快捷階段按鈕 */
        .phase-buttons { display: flex; gap: 10px; justify-content: center; margin-bottom: 30px; }
        .phase-btn {
            background: transparent; border: 1px solid var(--glass-border); color: white; padding: 8px 16px;
            border-radius: 20px; cursor: pointer; transition: 0.3s;
        }
        .phase-btn:hover, .phase-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }

        /* 時間顯示區 */
        .time-display { font-size: 6rem; font-weight: bold; margin: 20px 0; text-shadow: 0 0 20px rgba(0, 229, 255, 0.3); transition: color 0.3s; line-height: 1; }
        .time-display.warning { color: var(--warning); text-shadow: 0 0 20px rgba(255, 153, 0, 0.5); }
        .time-display.danger { color: var(--danger); text-shadow: 0 0 20px rgba(255, 0, 51, 0.5); animation: blink 1s infinite; }
        
        @keyframes blink { 50% { opacity: 0.5; } }

        /* 控制按鈕 */
        .controls { display: flex; gap: 15px; justify-content: center; }
        .btn {
            padding: 12px 30px; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: bold;
            cursor: pointer; transition: transform 0.2s, opacity 0.2s;
        }
        .btn:active { transform: scale(0.95); }
        .btn-start { background: var(--primary); color: #000; }
        .btn-pause { background: #334155; color: white; }
        .btn-reset { background: transparent; border: 1px solid #475569; color: #cbd5e1; }
        
        /* 自訂設定區 */
        .custom-settings { margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--glass-border); font-size: 0.9rem; color: #94a3b8; }
        .custom-settings input { background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border); color: white; padding: 5px; border-radius: 5px; width: 60px; text-align: center; margin: 0 5px; }
    </style>
</head>
<body>

<div class="timer-card">
    <h1>⚡ 辯論計時器</h1>
    
    <div class="phase-buttons">
        <button class="phase-btn active" onclick="setPhase(3, 30, this)">申論 (3分)</button>
        <button class="phase-btn" onclick="setPhase(2, 30, this)">質詢 (2分)</button>
        <button class="phase-btn" onclick="setPhase(4, 60, this)">結辯 (4分)</button>
    </div>

    <div class="time-display" id="display">03:00</div>

    <div class="controls">
        <button class="btn btn-start" id="startBtn" onclick="startTimer()">開始</button>
        <button class="btn btn-pause" onclick="pauseTimer()">暫停</button>
        <button class="btn btn-reset" onclick="resetTimer()">重置</button>
    </div>

    <div class="custom-settings">
        自訂：<input type="number" id="customMin" value="3" min="0"> 分 
        <input type="number" id="customSec" value="0" min="0" max="59"> 秒
        | 一短聲提醒於剩餘 <input type="number" id="warnSec" value="30" min="0"> 秒
    </div>
</div>

<script>
    let totalSeconds = 180;
    let currentSeconds = 180;
    let warningSeconds = 30;
    let timerInterval = null;
    let audioCtx = null;

    const display = document.getElementById('display');
    const startBtn = document.getElementById('startBtn');

    // 初始化 Web Audio API (在第一次點擊時初始化，避免瀏覽器阻擋)
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    // 發出嗶聲的函數
    function beep(type) {
        if (!audioCtx) return;
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.type = 'sine';
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        if (type === 'short') { // 剩餘時間提醒 (一短聲)
            oscillator.frequency.value = 880; 
            gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
            oscillator.start(); oscillator.stop(audioCtx.currentTime + 0.5);
        } else if (type === 'long') { // 時間到 (兩長聲)
            oscillator.frequency.value = 660;
            // 第一聲
            gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(1, audioCtx.currentTime + 0.8);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.0);
            // 第二聲
            gainNode.gain.setValueAtTime(1, audioCtx.currentTime + 1.2);
            gainNode.gain.setValueAtTime(1, audioCtx.currentTime + 2.0);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.2);
            oscillator.start(); oscillator.stop(audioCtx.currentTime + 2.2);
        }
    }

    function formatTime(sec) {
        const m = Math.floor(sec / 60).toString().padStart(2, '0');
        const s = (sec % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
    }

    function updateDisplay() {
        display.textContent = formatTime(currentSeconds);
        // 視覺變色提示
        display.className = 'time-display';
        if (currentSeconds <= warningSeconds && currentSeconds > 0) {
            display.classList.add('warning');
        } else if (currentSeconds === 0) {
            display.classList.add('danger');
        }
    }

    function setPhase(min, warn, btnElement) {
        document.querySelectorAll('.phase-btn').forEach(btn => btn.classList.remove('active'));
        if(btnElement) btnElement.classList.add('active');
        
        document.getElementById('customMin').value = min;
        document.getElementById('customSec').value = 0;
        document.getElementById('warnSec').value = warn;
        resetTimer();
    }

    function startTimer() {
        initAudio();
        if (timerInterval) return; // 避免重複點擊
        
        // 如果是重新開始或剛重置，讀取自訂輸入框的值
        if (currentSeconds === totalSeconds) {
            const m = parseInt(document.getElementById('customMin').value) || 0;
            const s = parseInt(document.getElementById('customSec').value) || 0;
            warningSeconds = parseInt(document.getElementById('warnSec').value) || 0;
            totalSeconds = (m * 60) + s;
            currentSeconds = totalSeconds;
        }

        if (currentSeconds <= 0) return;
        startBtn.textContent = "計時中...";
        
        timerInterval = setInterval(() => {
            currentSeconds--;
            updateDisplay();
            
            // 音效提示判斷
            if (currentSeconds === warningSeconds) beep('short');
            if (currentSeconds === 0) {
                beep('long');
                pauseTimer();
            }
        }, 1000);
    }

    function pauseTimer() {
        clearInterval(timerInterval);
        timerInterval = null;
        startBtn.textContent = "繼續";
    }

    function resetTimer() {
        pauseTimer();
        startBtn.textContent = "開始";
        const m = parseInt(document.getElementById('customMin').value) || 0;
        const s = parseInt(document.getElementById('customSec').value) || 0;
        warningSeconds = parseInt(document.getElementById('warnSec').value) || 30;
        totalSeconds = (m * 60) + s;
        currentSeconds = totalSeconds;
        updateDisplay();
    }

    // 初始化畫面
    updateDisplay();
</script>
</body>
</html>
